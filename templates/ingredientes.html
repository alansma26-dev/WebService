{% extends "base.html" %}

{% block content %}

<div class="card p-4">

<h2>📦 Ingredientes</h2>

<form method="POST">

<input
class="form-control mb-2"
name="nombre"
placeholder="Nombre">

<input
class="form-control mb-2"
name="unidad"
placeholder="Unidad">

<input
class="form-control mb-2"
name="precio"
placeholder="Precio">

<input
class="form-control mb-3"
name="cantidad"
placeholder="Cantidad">

<button class="btn btn-success">
Agregar
</button>

</form>

<hr>

<table class="table table-dark table-hover">

<tr>

<th>Nombre</th>
<th>Unidad</th>
<th>Precio</th>
<th>Cantidad</th>
<th>Eliminar</th>

</tr>

{% for i in data %}

<tr>

<td>{{ i[1] }}</td>
<td>{{ i[2] }}</td>
<td>${{ i[3] }}</td>
<td>{{ i[4] }}</td>

<td>

<form action="/delete/{{ i[0] }}" method="POST">

<button class="btn btn-danger btn-sm">
Eliminar
</button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
