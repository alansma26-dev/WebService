{% extends "base.html" %}

{% block content %}

<div class="card p-4 mx-auto" style="max-width:400px;">

<h2>📝 Registro</h2>

<form method="POST">

<input
class="form-control mb-3"
name="username"
placeholder="Usuario">

<input
class="form-control mb-3"
type="password"
name="password"
placeholder="Contraseña">

<input
class="form-control mb-3"
type="password"
name="key"
placeholder="Clave Family">

<button class="btn btn-success w-100">
Registrar
</button>

</form>

</div>

{% endblock %}
